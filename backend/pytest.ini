[pytest]
# Two xdist workers. loadscope pins each test class/module to one worker: the suites share one running
# backend and some classes rely on state created by earlier tests in the same class.
# Run serially with `-n 0` (not `-p no:xdist`, which errors because addopts still passes -n/--dist).
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
